[package]
name = "console-4000e"
version = "0.1.0"
edition = "2021"

[lib]
name = "console_4000e"
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
# Only for decoding the embedded background PNG into an egui texture at startup.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
strip = true
