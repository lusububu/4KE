name: Build 4000 E Console (Windows)

# Runs on GitHub's own Windows machines, so nothing compiles on your computer.
# Starts on every push that touches the plugin, or by hand from the Actions tab ("Run workflow").
on:
  push:
    paths:
      - "console-4000e/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: console-4000e
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console-4000e

      - name: Install the nih-plug bundler
        run: cargo install --git https://github.com/robbert-vdh/nih-plug.git cargo-nih-plug

      - name: Run the circuit parity tests
        run: cargo test --release

      - name: Build and bundle the plugin
        run: cargo nih-plug bundle console-4000e --release

      - name: Upload the built VST3/CLAP
        uses: actions/upload-artifact@v4
        with:
          name: console-4000e-windows
          path: console-4000e/target/bundled/
